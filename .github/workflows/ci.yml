name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / mcp-client ${{ matrix.mcp-client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        # 覆盖 peerDependency 声明范围内最低与最高发布的 dsh-mcp-client
        mcp-client: [0.1.0-rc.6, 0.1.0-rc.8, 0.1.1-rc.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Pin dsh-mcp-client to matrix version
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-mcp-client@${{ matrix.mcp-client }}
      - name: Run tests
        run: npm test