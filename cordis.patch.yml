      #       enabled: true
      #       transport: stdio
      #       command: npx
      #       args:
      #         - '-y'
      #         - '@modelcontextprotocol/server-github'
      #       env:
      #         GITHUB_TOKEN: 'your-token'
      #       cwd: ''
      #       url: ''
      #       headers: {}
